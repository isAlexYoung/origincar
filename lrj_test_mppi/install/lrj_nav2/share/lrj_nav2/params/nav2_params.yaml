bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25 # default = 0.25


    # 2.my MPPI
    FollowPath:
      plugin: "rm_mppi_controller::MPPIController"
      frequency: 20.0
      max_v: 1.5
      max_w: 1.5  # default = 1.5
      step_T: 50     # 
      samples_K: 100 # 
      lambda: 50.0  # temperature parameter: 越大越随机，越小越趋向最优（但可能陷入局部最优） 太小会发神经, 太大没有输出
      gamma_dv: 0.1   # 
      gamma_dw: 0.1   # 
      gamma_v: 1.0   # 
      gamma_w: 0.5   # 
      sigma_v: 0.2  # velocity 方差越大，速度会越快
      sigma_w: 0.4  # omega
      stage_cost_weight_x: 10.0
      stage_cost_weight_y: 10.0
      stage_cost_weight_yaw: 1.0  # 加大这个朝向的权重，机器人会抄近路
      terminal_cost_weight_x: 10.0
      terminal_cost_weight_y: 10.0
      terminal_cost_weight_yaw: 1.0  # 加大这个朝向的权重，机器人会抄近路
      obstacle_cost_weight: 50.0      # 一般避障权重
      critical_weight: 500.0         # 严重惩罚权重 (安全边距内)
      collision_cost: 1000.0       # 碰撞代价
      collision_margin_distance: 0.5 # 安全边距 (米)
      near_goal_distance: 0.5        # 接近目标距离，此距离内停用一般避障项
      inflation_radius: 0.15
      cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0  # 更新频率（Hz）：越高越“跟手”，但更耗算力
      publish_frequency: 10.0  # 发布频率（Hz）
      global_frame: odom  # 局部代价地图参考系：常用 odom；需要 TF 可达 odom->base
      robot_base_frame: base  # 机器人底座系：用于足迹/碰撞计算
      use_sim_time: False  # 是否使用仿真时间
      rolling_window: true  # 滚动窗口：以机器人为中心随移动滚动（局部 costmap 通常为 true）
      width: 3  # 局部窗宽度（m）  default = 3
      height: 3  # 局部窗高度（m） default = 3
      resolution: 0.1  # 分辨率（m/格）：更小更精细但更耗算力  default = 0.05
      robot_radius: 0.22
      footprint_padding: 0.02  # 依据：额外安全裕度（定位误差、控制抖动、传感器噪声等）；越大越保守，常见 0.01~0.03m
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]  # 层插件：局部常用体素/障碍层 + 膨胀层（static_layer 需显式加入才生效）
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀层：让障碍周围区域变“更贵”，影响贴边程度
        cost_scaling_factor: 3.0  # 代价衰减系数：越大衰减越快（更敢贴边）  default = 3.0  TODO
        inflation_radius: 0.2  # 膨胀半径：越大越保守（离障碍更远）  default = 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"  # 体素层：内部维护 3D 体素栅格（z_voxels 层），最终仍投影为 2D costmap
        enabled: True  # 是否启用该层
        publish_voxel_map: True  # 是否发布 voxel_grid 可视化（调试用，可能更耗带宽/算力）
        origin_z: -0.342  # 体素栅格 z 方向起点（m）
        z_resolution: 0.05  # 单个体素高度（m）
        z_voxels: 16  # z 方向体素层数（总高度约 = z_resolution * z_voxels）
        max_obstacle_height: 2.0  # 障碍高度上限（m）：高于此高度的点会被过滤
        mark_threshold: 0  # 每个 (x,y) 列里，达到该占用阈值后认为该列为障碍（越小越敏感）
        observation_sources: scan  # 观测源列表（名字需与下方同名块一致）
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"  # 静态地图层：来自 map_server 的栅格地图（需加入 plugins 才会启用）
        map_subscribe_transient_local: True  # Transient Local 订阅：避免“后启动收不到地图”
      always_send_full_costmap: True  # 是否总是发布全量 costmap

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0  # 更新频率（Hz）：越高越“跟手”，但更耗算力
      publish_frequency: 1.0  # 发布频率（Hz）
      global_frame: map  # 全局参考系：常用 map；需要 TF 可达 map->odom->base
      robot_base_frame: base  # 机器人底座系：用于足迹/碰撞计算
      use_sim_time: False  # 是否使用仿真时间
      robot_radius: 0.22
      resolution: 0.05  # 分辨率（m/格）：更小更精细但更耗算力
      track_unknown_space: true  # 是否把未知区纳入代价地图：影响是否敢走“未知区域”
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # 层插件：通常必须有 static_layer 才能纳入静态地图
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"  # 动态障碍层：把传感器观测叠加到静态地图上
        enabled: True  # 是否启用该层
        observation_sources: scan  # 观测源列表（名字需与下方同名块一致）
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"  # 静态地图层：来自 map_server 的栅格地图
        map_subscribe_transient_local: True  # Transient Local 订阅：避免“后启动 costmap 收不到地图”
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀层：让障碍周围区域变“更贵”，影响贴边程度
        cost_scaling_factor: 3.0  # 代价衰减系数：越大衰减越快（更敢贴边）
        inflation_radius: 0.15  # 膨胀半径：越大越保守（离障碍更远）  default = 0.55
      always_send_full_costmap: True  # 是否总是发布全量 costmap

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0 # 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    # 1. A* or Dijkstra，平滑性差但稳定
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.5, 0.0, 2.0]
    min_velocity: [-1.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
